<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GAVPS Foundation — Coming Soon</title>
  <meta name="description" content="GAVPS Foundation is coming soon. Connect with us shortly as we prepare to give aid to people across society.">
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    :root {
      --green: #4b9f2d;
      --green-deep: #2f7a1c;
      --blue: #0170bb;
      --ink: #1c2b22;
      --muted: #3e5348;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      color: var(--ink);
      background:
        radial-gradient(900px 480px at 50% -10%, rgba(75, 159, 45, 0.16), transparent 70%),
        radial-gradient(700px 420px at 100% 100%, rgba(1, 112, 187, 0.12), transparent 65%),
        #f7faf6;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }

    main {
      width: min(640px, 100%);
      margin-inline: auto;
      text-align: center;
    }

    .logo {
      width: min(460px, 100%);
      height: auto;
      display: block;
      margin: 0 auto 8px;
    }

    .rule {
      width: min(280px, 70%);
      height: 3px;
      margin: 28px auto 22px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--green), var(--blue));
    }

    .eyebrow {
      margin: 0 auto 14px;
      text-align: center;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--blue);
    }

    h1 {
      margin: 0 auto 16px;
      text-align: center;
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--green-deep);
    }

    .message {
      margin: 0 auto;
      max-width: 34rem;
      text-align: center;
      font-size: 1.15rem;
      line-height: 1.65;
      color: var(--muted);
    }

    .note {
      margin: 22px auto 0;
      max-width: 30rem;
      text-align: center;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--blue);
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="GAVPS Foundation — Giving Aid to Various People of the Society">
    <hr class="rule">
    <p class="eyebrow">Coming soon</p>
    <h1>We will connect with you soon</h1>
    <p class="message">
      GAVPS Foundation is preparing to open this site to the public.
      Soon you will be able to reach us, learn about our work, and join us
      in giving aid to people across society.
    </p>
    <p class="note">Please visit again shortly. We look forward to connecting with you.</p>
  </main>
</body>
</html>
